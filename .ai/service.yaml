schema_version: 1
name: ms-go-dialog
service_kind: backend_service
repository_role: service
repository:
    git_url: pending
    default_branch: main
purpose: >-
    Independent authenticated personal and group messaging service. It owns dialogs,
    membership, messages, per-member read state, attachment authorization, moderation,
    realtime sequencing, WebSocket tickets, and outbox delivery. It does not own user
    profiles, authentication credentials, or attachment bytes.
release_contract_map: docs/agent-contract-map.md
stack:
    - name: language
      value: go
      source_path: go.mod
    - name: framework
      value: chi
      source_path: go.mod
    - name: persistence
      value: PostgreSQL with pgx
      source_path: go.mod
    - name: realtime
      value: NATS JetStream and Gorilla WebSocket
      source_path: go.mod
capabilities:
    - name: repository_bootstrap
      status: implemented
      source_path: AGENTS.md
    - name: personal_and_group_dialogs
      status: implemented
      source_path: docs/domain-map.md
    - name: per_member_read_state
      status: implemented
      source_path: docs/business-rules.md
    - name: files_and_images
      status: implemented
      source_path: docs/attachment-lifecycle.md
    - name: user_scoped_realtime
      status: implemented
      source_path: docs/websocket-contract.md
relations:
    - name: depends_on
      value: postgres
    - name: depends_on
      value: nats
    - name: depends_on
      value: ms-go-filestorage
    - name: resolves_profiles_from
      value: ms-go-user
    - name: receives_identity_from
      value: ms-gateway
contracts:
    - .ai/contracts/database.yaml
    - .ai/contracts/http.yaml
    - .ai/contracts/websocket.yaml
    - .ai/contracts/events.yaml
instructions:
    - AGENTS.md
    - prompts/git-workflow.md
    - docs/domain-map.md
    - docs/agent-contract-map.md
commands:
    - format
    - dependencies
    - tidy
    - test
    - lint
    - validate_contracts
    - migrate_local
    - run_local
    - start_local_stack
    - stop_local_stack
workflows:
    - .ai/workflows/implement-feature.yaml
    - .ai/workflows/change-contract.yaml
    - .ai/workflows/test.yaml
