name: Testing Policy Canary

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testing-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"

      - name: Set up Go 1.24.4
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.4"
          cache: true

      - name: Install pinned golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          lint_bin="$GITHUB_WORKSPACE/.cache/bin"
          mkdir -p "$lint_bin"
          GOTOOLCHAIN=go1.24.4 GOBIN="$lint_bin" go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$lint_bin" >> "$GITHUB_PATH"
          export PATH="$lint_bin:$PATH"
          resolved_linter="$(command -v golangci-lint)"
          if [[ "$resolved_linter" != "$lint_bin/golangci-lint" ]]; then
            echo "Unexpected golangci-lint executable: $resolved_linter" >&2
            exit 1
          fi
          linter_version="$("$resolved_linter" version)"
          printf '%s\n' "$linter_version"
          grep -Fq 'version v1.64.8' <<< "$linter_version"
          grep -Fq 'built with go1.24.4' <<< "$linter_version"

      - name: Check policy bundle checksum before execution
        run: |
          node --input-type=commonjs <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          if (process.versions.node.split('.')[0] !== '20') {
            console.error(`Policy runner requires Node 20; found ${process.versions.node}.`);
            process.exit(2);
          }
          const bundle = readFileSync('.ai/testing/policy/policy-runner.cjs');
          const lock = JSON.parse(readFileSync('.ai/testing/policy/policy-lock.json', 'utf8'));
          const digest = createHash('sha256').update(bundle).digest('hex');
          if (digest !== lock.bundle_sha256) {
            console.error('Policy bundle checksum does not match policy-lock.json.');
            process.exit(1);
          }
          console.log(`bundle checksum PASS sha256=${digest}`);
          NODE
          node .ai/testing/policy/policy-runner.cjs --version
          node .ai/testing/policy/policy-runner.cjs verify-lock --lock .ai/testing/policy/policy-lock.json

      - name: Validate testing manifest
        run: node .ai/testing/policy/policy-runner.cjs validate --repo .

      - name: Run verify:fast policy baseline
        id: policy_run
        continue-on-error: true
        env:
          POLICY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          node .ai/testing/policy/policy-runner.cjs verify
          --repo .
          --command verify:fast
          --output-dir .
          --run-id "$POLICY_RUN_ID"

      - name: Validate policy result artifacts
        id: result_validation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d test-results ]]; then
            echo 'No test-results directory was produced.' >&2
            exit 1
          fi
          mapfile -d '' result_files < <(find test-results -type f -name test-result.v1.json -print0)
          if ((${#result_files[@]} == 0)); then
            echo 'No test-result.v1.json files were produced.' >&2
            exit 1
          fi
          for result in "${result_files[@]}"; do
            node .ai/testing/policy/policy-runner.cjs validate-result --repo . --result "$result"
          done

      - name: Upload policy result artifacts
        id: result_upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testing-policy-results
          path: test-results/**
          if-no-files-found: error
          retention-days: 30

      - name: Enforce policy result after artifact upload
        if: always()
        env:
          POLICY_RUN_OUTCOME: ${{ steps.policy_run.outcome }}
          RESULT_VALIDATION_OUTCOME: ${{ steps.result_validation.outcome }}
          RESULT_UPLOAD_OUTCOME: ${{ steps.result_upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESULT_VALIDATION_OUTCOME" != success ]]; then
            echo "Policy result validation failed (outcome: $RESULT_VALIDATION_OUTCOME)" >&2
            exit 1
          fi
          if [[ "$RESULT_UPLOAD_OUTCOME" != success ]]; then
            echo "Policy result upload failed (outcome: $RESULT_UPLOAD_OUTCOME)" >&2
            exit 1
          fi
          if [[ ! -d test-results ]]; then
            echo 'No test-results directory is available for final enforcement.' >&2
            exit 1
          fi
          mapfile -d '' result_files < <(find test-results -type f -name test-result.v1.json -print0)
          if ((${#result_files[@]} == 0)); then
            echo 'No test-result.v1.json files are available for final enforcement.' >&2
            exit 1
          fi
          for result in "${result_files[@]}"; do
            node .ai/testing/policy/policy-runner.cjs enforce-result --repo . --result "$result"
          done
          if [[ "$POLICY_RUN_OUTCOME" != success ]]; then
            echo "Policy fast tier did not pass (outcome: $POLICY_RUN_OUTCOME)" >&2
            exit 1
          fi
