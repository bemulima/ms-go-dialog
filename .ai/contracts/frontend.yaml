schema_version: 1
status: backend_contract_implemented_frontend_planned
source_of_truth: docs/frontend-backend-contract-map.md
message_loading:
    initial: GET /api/v1/message/window around first unread
    no_unread: full before + after budget from the newest messages
    window_cursors: null when no visible message remains in that direction
    older: GET /api/v1/message/list with before_cursor
    newer: GET /api/v1/message/list with after_cursor
    order: ascending message_sequence
read_state:
    owner: one dialog_member row per user and dialog
    visible_batch: PUT /api/v1/dialog/read/{dialogID}
    read_all: PUT /api/v1/dialog/read-all/{dialogID}
    rule: loading does not mark read; only contiguous read-through mutates state
    stale_request: valid cursor at or below stored cursor is a successful no-op
realtime:
    scope: one user and one space per connection
    recovery: compare connection.ready dialog high-water marks and reconcile through REST
    deduplication: event_id
attachments:
    flow: upload temporary attachment, bind IDs on message create, wait for ready event, request signed URL
teacher_dialogs:
    discovery: returned through the normal authenticated dialog list after internal provisioning
    author_discriminator: author_type is user or personal_teacher; sender_id is null for teacher messages
    channel_provenance: channel is web or telegram; all transports share the same ordered history
    task_request: lesson_task, practice_task, and project messages require learning_action_id
    lesson_request: lesson messages use v1 timestamp anchors or lesson-message-context.v2 frozen assignment anchors with exact Course/lesson/revision/path/item UUIDs and sha256 lowercase64 digest
    lesson_selection: omit selected_text for lesson_overview; preserve the exact non-blank selection without client normalization for selection
    lesson_compatibility: render historical legacy revision/selection anchors but never invent missing v1 IDs or mode
    lesson_model_boundary: Dialog preserves the immutable anchor; Teacher verifies v1 against Course and v2 against Student authoritative frozen assignment; no v2 mutable Course fallback
    response_delivery: normal message.created REST/WebSocket projection
    structured_response:
        field: optional assistant_ui
        envelope_schema: assistant-ui.v1
        limits: 32 object blocks and 65536 encoded JSON bytes
        semantics: opaque to Dialog; consumers validate supported block discriminators independently and always retain body fallback
        browser_write: forbidden on create and update
        stored_source_projection: internal-only; browser and admin clients cannot call it
    canonical_action:
        status: S2_server_only_materialization_disabled_by_default
        browser_command_owner: ms-go-teacher-agent
        browser_dialog_dual_write: forbidden
        dialog_materialization: exact-token internal nested identity plus canonical_body; requires DIALOG_CANONICAL_STUDENT_TURN_ENABLED and teacher ordering V2
        private_response_fields: never exposed in REST/WebSocket
        forbidden_browser_fields:
            - interaction
            - action_receipt_id
            - correlation_id
            - causation_id
            - teacher_turn_sequence
            - source_prompt_message_id
            - source_prompt_message_version
            - source_ui_digest
        teacher_action_only_fields:
            - block_id
            - action_id
        projection: ordinary message.created REST/WebSocket evidence only
