schema_version: 1
status: implemented
source_of_truth: docs/websocket-contract.md
endpoint: GET /api/v1/ws
protocol: dialog.v1
authentication:
    mechanism: short-lived single-use opaque ticket
    transport: Sec-WebSocket-Protocol ticket.<opaque>
    maximum_ttl_seconds: 30
    query_credentials: forbidden
server_events:
    durable:
        - dialog.created
        - dialog.updated
        - dialog.closed
        - member.added
        - member.removed
        - member.role_updated
        - message.created
        - message.updated
        - message.deleted
        - message.hidden
        - message.restored
        - read.updated
        - attachment.ready
        - attachment.failed
    ephemeral:
        - connection.ready
        - typing.started
        - typing.stopped
        - teacher.progress.updated
        - error
        - ping
client_events:
    - typing.start
    - typing.stop
    - pong
limits:
    default_max_frame_bytes: 16384
    default_connections_per_user: 5
    default_outbound_queue_frames: 64

mentor_education:
    source_of_truth: docs/mentor-education-v1.md
    payload_delivery: denied on generic websocket; use current-owner HTTP polling
    durable_fence: check message binding and protected Cohort before any lifecycle or ephemeral fanout

teacher_response_preview_v1:
    transport: dialog.v1, existing ticket and origin checks
    events: [teacher.response.started, teacher.response.delta, teacher.response.completed, teacher.response.failed, teacher.response.cancelled]
    owner_scope: active membership and matching student in a regular Teacher dialog
    sequence: independent of the durable event cursor and fenced by the processing attempt
    reconnect: latest active snapshot or text-free terminal state, best-effort in-memory for up to 45 seconds
    final_answer: recover the canonical message by the existing durable Dialog mechanism
