schema_version: 1
status: implemented
source_of_truth: docs/http-contract.md
route_groups:
    - prefix: /
      authentication: private operational network only; never public gateway routing
      routes:
        - GET /healthz
        - GET /readyz
        - GET /metrics
    - prefix: /api/v1
      authentication: required gateway identity and active membership where dialog-scoped
      routes:
        - PUT /dialog/personal/ensure
        - POST /dialogs/mentor-context
        - POST /message-report
        - POST /dialog/group/create
        - GET /dialog/list
        - GET /dialog/get/{dialogID}
        - PUT /dialog/update/{dialogID}
        - PUT /dialog/read/{dialogID}
        - PUT /dialog/read-all/{dialogID}
        - POST /dialog/leave/{dialogID}
        - POST /dialog-member/add/{dialogID}
        - DELETE /dialog-member/remove/{dialogID}/{userID}
        - PUT /dialog-member/role/{dialogID}/{userID}
        - PUT /user-block/{userID}
        - DELETE /user-block/{userID}
        - GET /message/window
        - GET /message/list
        - GET /message/get/{messageID}
        - GET /message/changes
        - POST /message/create
        - PUT /message/update/{messageID}
        - DELETE /message/delete/{messageID}
        - POST /message-attachment/upload
        - GET /message-attachment/signed-url/{attachmentID}
        - DELETE /message-attachment/delete/{attachmentID}
        - POST /realtime/ticket
        - GET /ws
    - prefix: /admin/v1
      authentication: ADMIN configuration; ADMIN or MODERATOR explicit moderation
      routes:
        - POST /space/create
        - GET /space/list
        - PUT /space/update/{spaceID}
        - GET /dialog/list
        - PUT /dialog/close/{dialogID}
        - PUT /dialog/reopen/{dialogID}
        - PUT /message/hide/{messageID}
        - PUT /message/restore/{messageID}
        - GET /message-report/list
        - POST /message-report/{reportID}/resolve
    - prefix: /internal/v1
      authentication: exact purpose-specific X-Internal-Token; never gateway or browser routed
      routes:
        - PUT /teacher-dialog/ensure
        - GET /teacher-dialog/{dialogID}/request/{sourceMessageID}
        - POST /teacher-dialog/{dialogID}/assistant-ui-source
        - POST /teacher-dialog/{dialogID}/canonical-student-turn
        - POST /teacher-dialog/{dialogID}/message
        - POST /teacher-dialog/{dialogID}/proactive-message
        - POST /teacher-dialog/{dialogID}/student-channel-message
        - POST /mentor-dialog/ensure-personal
pagination:
    message_order: message_sequence
    cursor: opaque and dialog scoped
error_contract: docs/error-contract.md
operations_contract: docs/operations.md
teacher_dialog:
    provisioning: internal command from ms-go-teacher-agent; browser cannot select personal_teacher_id
    request_context: exact source message plus at most 49 preceding messages; no unrestricted history
    lesson_context:
        schemas: lesson-message-context.v1 and lesson-message-context.v2
        accepted_by: authenticated user message create for an exact lesson teacher dialog only
        modes: lesson_overview forbids selected_text; selection requires exact non-blank selected_text
        fields: strict schema, mode, non-zero course_id and lesson_id UUIDs, RFC3339Nano content_revision, optional selected_text
        v2_fields: exact schema, mode, non-zero course_id/lesson_id/learning_path_id/learning_path_item_id UUIDs, UUID LessonRevision content_revision, sha256 lowercase64 content_digest; selected_text only selection
        strictness: reject unknown, null, partial, and cross-schema fields; never downgrade v2
        authority: Dialog binds lesson_id only; Teacher verifies full v2 anchor against Student authoritative frozen assignment, with no mutable Course fallback
        storage: preserve complete anchor in existing lesson_context JSON column; database constraint must accept v2 before producer deployment
        limits: selected_text at most 12000 Unicode code points
        binding: lesson_id must equal the dialog context_id
        immutability: create replay compares the complete anchor; update rejects the field; delete clears it
        compatibility: legacy content_revision plus selected_text remains readable, replayable, and temporarily create-compatible
    content_anchor:
        schema: teacher-content-anchor.v1
        optional: true
        kinds: [COURSE, MODULE, LESSON, EXAMPLE, TEST, LESSON_TASK, PRACTICE_TASK, PROJECT]
        pins: canonical UUID or UTC RFC3339Nano content_revision and/or lowercase sha256 content_digest
        scope: exact typed course/module/lesson/artifact/task UUIDs and optional en/ru language_code
        binding: COURSE/MODULE in general Teacher; EXAMPLE/TEST/LESSON in matching lesson; action contexts match the Dialog artifact and learning_action_id
        teacher_read: top-level field for the canonical source only; absent from prior messages and durable request events
        authority: Dialog verifies format, author, binding, and immutable replay; Teacher verifies owner ACL and revision before generation
    response_append: idempotent per personal_teacher_id and key; source message is the reply target
    channel_append: trusted Telegram adapter only; exact general binding and deterministic UUID idempotency key
    assistant_ui:
        accepted_by: internal response and proactive append only
        schema: assistant-ui.v1
        limits: 32 object blocks and 65536 encoded JSON bytes
        validation: envelope only; pedagogical block semantics remain opaque
        compatibility: optional in REST message responses; body remains required
        browser_create_update: rejected as unknown input
        stored_source_projection:
            route: POST /internal/v1/teacher-dialog/{dialogID}/assistant-ui-source
            request: exact student_id, personal_teacher_id, message_id; at most 4096 bytes
            response_schema: dialog-assistant-ui-source.v1
            response_allowlist: binding ids/context, message id/sequence/version, stored canonical assistant_ui
            absence_policy: wrong, missing, inactive, or cross-binding sources are indistinguishable 404
            exposure: internal exact-token only; no browser or admin route
    canonical_student_turn:
        status: S2_internal_runtime_gated_disabled_by_default
        public_message_create: does not accept interaction, receipt, correlation, causation, ordering, source prompt, source_ui_digest, block_id, or action_id fields
        materialization:
            route: POST /internal/v1/teacher-dialog/{dialogID}/canonical-student-turn
            authentication: exact X-Internal-Token
            request: nested identity canonical-student-turn-identity.v1 plus canonical_body; strict unknown-field rejection
            response: ordinary existing message response only; no private identity, receipt, digest, command, or sequence
            status_codes: 201 new, 200 exact committed replay, 409 identity/body/metadata/source conflict or disabled new receipt
            context: active bound general_teacher only
            rollout: DIALOG_CANONICAL_STUDENT_TURN_ENABLED=false; requires DIALOG_TEACHER_ORDERING_V2_ENABLED
            privacy: ledger never appears in public REST, WebSocket, or ordinary lifecycle event
        browser_dual_write: forbidden
mentor_contact:
    status: implemented_gated_disabled_by_default
    route: POST /internal/v1/mentor-dialog/ensure-personal
    authentication: one exact X-Internal-Token using DIALOG_MENTOR_INTERNAL_TOKEN, distinct from Teacher and outbound credentials
    gate: DIALOG_MENTOR_CONTACT_ENABLED=false
    space: DIALOG_MENTOR_CONTACT_SPACE_KEY selects an existing personal-enabled space; never accepted from a caller
    caller: ms-go-mentor validates current approved Mentor and published Offer for the verified Student before and after the call
    request: exact mentor-contact.ensure.v1 schema, canonical distinct non-zero student_id and mentor_id UUIDs
    request_limits: 1024 bytes, application/json, no query or Content-Encoding, no null/unknown/duplicate fields
    response: data object with exact mentor-contact.dialog.v1 schema, dialog_id UUID, dialog_version 1..2147483647, student_id and mentor_id
    status_codes: 200 create or pair replay; 400 invalid; 401 credential; 403 blocked/forbidden; 404 unavailable; 409 disabled; 422 participant unavailable; 429 rate limited; 503 dependency unavailable
    authorization: both active participants before/after; local space/block fences before/inside/after ensure; active exact pair readback
    identity: existing personal dialog pair per space; no Offer/Assignment binding and no new conversation type
    effects: normal Dialog-created event and memberships only on first creation; no message, consent, progress, code, Teacher identity or learning grants
    history: ordinary participant-owned history; assignment revoke does not erase it; existing block/moderation/message policies remain authoritative
    limitation: source preparation, not runtime acceptance; no claim of assigned/Cohort ACL or cross-service atomicity

mentor_education:
    source_of_truth: docs/mentor-education-v1.md
    ensure: POST /api/v1/dialogs/mentor-context
    selector_header: X-Mentor-Dialog-Context
    owner_access: POST /internal/dialog/v1/context-access on ms-go-mentor
    owner_token_header: X-Mentor-Dialog-Token
    default_enabled: false
    context_page_limit: 30
mentor_mcp_dialog_reads:
    source_of_truth: docs/mentor-education-v1.md
    list: POST /internal/v1/mentor-mcp/dialogs
    history: POST /internal/v1/mentor-mcp/dialog-messages
    token_header: X-Mentor-Dialog-MCP-Read-Token
    token_configuration: DIALOG_MENTOR_MCP_READ_TOKEN
    default_enabled: false
    requires: DIALOG_MENTOR_EDUCATION_ENABLED
    request_limit_bytes: 1024
    page_limit: 20
    message_body_limit_codepoints: 800
    access: current owner-fenced Mentor Assignment or Cohort binding and current author history
    effects: read only
mentor_mcp_dialog_sends:
    source_of_truth: docs/mentor-education-v1.md
    preview: POST /internal/v1/mentor-mcp/message-preview
    send: POST /internal/v1/mentor-mcp/message-send
    token_header: X-Mentor-Dialog-MCP-Write-Token
    token_configuration: DIALOG_MENTOR_MCP_WRITE_TOKEN
    default_enabled: false
    requires: DIALOG_MENTOR_EDUCATION_ENABLED
    request_limit_bytes: 32768
    message_body_limit_utf8_bytes: 2000
    permission: mentor:dialogs:write with an exact first-party Mentor confirmation
    owner_effect: existing educational message creation and atomic immutable send receipt
abuse_reports:
    source_of_truth: docs/mentor-education-v1.md
    submit: POST /api/v1/message-report
    queue: GET /admin/v1/message-report/list
    resolve: POST /admin/v1/message-report/{reportID}/resolve
    idempotency: exact single Idempotency-Key equals request_id on both mutations
    default_enabled: false

teacher_policy_selection:
    source_of_truth: docs/teacher-policy-selection-v1.md
    contract: .ai/contracts/teacher-policy-selection.yaml
    path: POST /api/v1/message/create
    field: teacher_policy_selection
    default_enabled: false
    new_endpoint: false
