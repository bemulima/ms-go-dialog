schema_version: 1
commands:
    - name: agent_policy
      run: ./scripts/check-agent-policy.sh
      source_path: scripts/check-agent-policy.sh
      requires_approval: false
      risk: verification
    - name: architecture
      run: python3 scripts/check_architecture.py
      source_path: scripts/check_architecture.py
      requires_approval: false
      risk: verification
    - name: format
      run: gofmt -w cmd internal test
      source_path: Makefile
      requires_approval: false
      risk: formatting
    - name: dependencies
      run: XDG_CACHE_HOME=$PWD/.cache GOMODCACHE=$PWD/.cache/gomod go mod download all
      source_path: Makefile
      requires_approval: false
      risk: dependency_state
    - name: tidy
      run: XDG_CACHE_HOME=$PWD/.cache GOMODCACHE=$PWD/.cache/gomod go mod tidy
      source_path: Makefile
      requires_approval: false
      risk: dependency_state
    - name: test
      run: make test
      source_path: Makefile
      requires_approval: false
      risk: verification
    - name: native_run
      run: python3 scripts/native_config.py -- go run ./cmd/ms-dialog-service
      source_path: Taskfile.yml
      requires_approval: true
      risk: lifecycle
    - name: native_migration_status
      run: python3 scripts/native_config.py -- sh scripts/native_migrate_status.sh
      source_path: Taskfile.yml
      requires_approval: true
      risk: database_inspection
    - name: native_migrate
      run: python3 scripts/native_config.py -- env DIALOG_MIGRATION_TRANSPORT=native sh scripts/migrate.sh
      source_path: Taskfile.yml
      requires_approval: true
      risk: database_change
    - name: lint
      run: $PWD/.cache/bin/golangci-lint run ./...
      source_path: Makefile
      requires_approval: false
      risk: verification
    - name: validate_contracts
      run: make validate-contracts
      source_path: Makefile
      requires_approval: false
      risk: verification
    - name: runtime_e2e
      run: DIALOG_E2E_ADMIN_TOKEN=<token> make runtime-e2e
      source_path: Makefile
      requires_approval: true
      risk: integration_data_change
    - name: migrate_local
      run: make migrate
      source_path: Makefile
      requires_approval: true
      risk: database_change
    - name: run_local
      run: go run ./cmd/ms-dialog-service
      source_path: Taskfile.yml
      requires_approval: true
      risk: lifecycle
    - name: start_local_stack
      run: docker compose up -d --build
      source_path: Taskfile.yml
      requires_approval: true
      risk: external_runtime
    - name: stop_local_stack
      run: docker compose down -v
      source_path: Taskfile.yml
      requires_approval: true
      risk: state_change
