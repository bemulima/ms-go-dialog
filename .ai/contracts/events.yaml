schema_version: 1
status: implemented
source_of_truth: docs/realtime-delivery.md
delivery:
    durable_transport: NATS JetStream
    persistence_boundary: PostgreSQL transactional outbox
    semantics: at-least-once
    deduplication_key: event_id
subjects:
    - dialog.created
    - dialog.updated
    - dialog.closed
    - dialog.member.added
    - dialog.member.removed
    - dialog.member.role_updated
    - dialog.message.created
    - dialog.message.updated
    - dialog.message.deleted
    - dialog.message.hidden
    - dialog.message.restored
    - dialog.attachment.ready
    - dialog.attachment.failed
    - dialog.read.updated
    - dialog.teacher.requested
    - dialog.teacher.context-mutated
required_envelope_fields:
    - schema_version
    - event_id
    - occurred_at
    - dialog_id
    - event_sequence
consumer_rules:
    - deduplicate by event_id
    - WebSocket lifecycle consumers compare event_sequence independently per dialog
    - WebSocket lifecycle consumers reconcile gaps through REST snapshots and message changes
teacher_requested:
    audience: ms-go-teacher-agent only; not projected to WebSocket
    source: committed student-authored message in a teacher dialog
    sequence: shares the source message mutation event_sequence
    contains:
        - source_message_id
        - source_message_sequence
        - channel
        - student_id
        - personal_teacher_id
        - context_type
        - optional context_id
        - optional learning_action_id
    excludes:
        - message body
        - lesson_context
        - mastery
        - dialog history
    canonical_v2:
        status: implemented_gated_disabled_by_default
        schema_version: 2
        source: new qualifying student-authored source message in a teacher dialog
        rollout_flag: DIALOG_TEACHER_ORDERING_V2_ENABLED
        emission: exactly one V2 event when the flag is enabled; V1 only when disabled; never dual emit
        allocation: Dialog assigns a dense per-dialog teacher_turn_sequence under its existing locked dialog row after idempotency replay and before the message, counter, and outbox commit
        legacy: existing rows remain unsequenced and are not backfilled
        adds:
            - canonical_student_message_id
            - teacher_turn_sequence
            - correlation_id
            - causation_id
            - optional action_receipt_id only for trusted canonical action materialization; equal to correlation_id
            - optional source_message_version for queued V2 compatibility; every newly emitted V2 event carries the positive source-message version captured with its outbox row
            - optional nullable reply_to_message_id for queued V2 compatibility; every newly emitted V2 event explicitly carries the source message reply UUID or null
        causal_ledger: source_prompt_message_id -> action_receipt_id -> canonical_student_message_id -> source_event_id -> teacher_job_id -> teacher_response_message_id
        identifier_type: UUID, including correlation_id and causation_id
        direct_text_correlation: canonical_student_message_id
        action_correlation: action_receipt_id across receipt, message, request, job, and response
        causation: source_prompt_message_id for receipt validation; action_receipt_id for Dialog materialization; canonical_student_message_id for the request event; source_event_id for Teacher-job intake; teacher_job_id for response append
        observability:
            - canonical_student_message_id
            - source_event_id
            - teacher_job_id
            - teacher_response_message_id
            - no_effect_proof_id
            - recoverable_outcome_id
            - failure_code
        observability_storage: owning durable records and structured logs; identifiers are never metric labels
        excludes:
            - trusted interaction metadata
            - block_id
            - action_id
            - source_ui_digest
            - student_command_id
            - browser action payload
            - assistant_ui
            - message body
            - lesson_context
            - mastery
            - dialog history
        runtime: direct source producer is gated by DIALOG_TEACHER_ORDERING_V2_ENABLED; trusted canonical action materialization additionally requires DIALOG_CANONICAL_STUDENT_TURN_ENABLED and never emits V1
teacher_context_mutated:
    schema_version: 1
    audience: ms-go-teacher-agent only; not projected to WebSocket
    source: committed update or delete of an active student-authored message in an active teacher dialog
    context_types: general_teacher, lesson, lesson_task, practice_task, project
    sequence: shares the ordinary message mutation event_sequence
    contains:
        - event_type
        - student_id
        - personal_teacher_id
        - context_type
        - optional context_id
        - message_id
        - message_sequence
        - message_version
        - last_event_sequence
        - mutation
    mutation_values: updated, deleted
    excludes:
        - body
        - links
        - attachments
        - assistant_ui
        - lesson_context
        - learning_action_id
        - mastery or code
message_created:
    schema_version: 1
    compatibility: assistant_ui and lesson_context are additive optional fields; body-only v1 payloads are unchanged
    lesson_context:
        schema: lesson-message-context.v1 or historical legacy revision/selection
        presence: anchored user-authored lesson messages only; omitted after deletion
        access: ordinary message event and WebSocket membership/history ACL
        semantics: immutable anchor; Dialog does not own Course verification
    assistant_ui:
        schema: assistant-ui.v1
        presence: PersonalTeacher-authored structured messages only
        body_fallback: always retained
ephemeral:
    transport: Core NATS
    subject: dialog.realtime.typing.<dialog_uuid>
