services:
  postgres:
    container_name: ms-dialog-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ms_dialog}
    ports:
      - "${POSTGRES_PORT:-5444}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ms_dialog}"]
      interval: 2s
      timeout: 3s
      retries: 15

  ms-dialog-service:
    container_name: ms-dialog-service
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ms_dialog}?sslmode=disable
      NATS_URL: nats://nats:4222
      FILESTORAGE_SERVICE_BASE_URL: http://ms-filestorage:8080
      CLAMAV_ADDRESS: clamav:3310
      USER_SERVICE_BASE_URL: http://ms-user-service:8080
      USER_SERVICE_INTERNAL_TOKEN: ${USER_SERVICE_INTERNAL_TOKEN:-change-me}
      USER_SERVICE_TIMEOUT_SECONDS: "3"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
      SERVICE_MODE: all
      READINESS_TIMEOUT_SECONDS: "2"
      ATTACHMENT_WORKER_LEASE_SECONDS: "120"
      DIALOG_TEACHER_ORDERING_V2_ENABLED: "false"
      DIALOG_CANONICAL_STUDENT_TURN_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    ports:
      - "${DIALOG_PORT:-8095}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - default
      - ms-net

  clamav:
    image: clamav/clamav-debian:1.4
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:

networks:
  ms-net:
    external: true
