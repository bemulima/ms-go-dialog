schema_version: 1
status: implemented
source_of_truth: docs/database-contract.md
owned_tables:
    - dialog_space
    - dialog
    - dialog_member
    - dialog_message
    - dialog_attachment
    - dialog_outbox
    - dialog_ws_ticket
    - dialog_user_block
invariants:
    - personal dialog is unique per unordered pair inside a space
    - every member owns an independent monotonic read cursor and unread count
    - message sequence is immutable and separate from event sequence
    - message mutation and outbox evidence commit atomically
    - a teacher dialog has one real student member and one logical personal_teacher_id binding
    - user and personal-teacher message authors are mutually exclusive
    - every message channel is web or telegram; a teacher response inherits its source channel
    - task and project teacher requests retain the opaque learning_action_id supplied on the source message
    - new lesson teacher requests retain an exact lesson-message-context.v1 overview or selection anchor only on the user source message
    - v1 lesson_id equals the lesson teacher dialog context_id; legacy revision/selection anchors remain readable and replayable
    - body updates retain the immutable lesson_context; message deletion clears it together with user content
    - assistant_ui is nullable JSONB limited to PersonalTeacher-authored non-deleted messages and the assistant-ui.v1 envelope
    - message.created and teacher.requested evidence for one source mutation may share one event sequence and differ by subject
    - a student message update/delete in an active teacher dialog atomically stores ordinary lifecycle evidence and body-free dialog.teacher.context-mutated evidence with one event sequence
    - proactive PersonalTeacher messages are restricted to general_teacher dialogs and have no synthetic user source, reply, learning action, or lesson context
    - attachment binding never crosses sender or dialog ownership
    - attachment workers use finite leased SKIP LOCKED claims across replicas
migration_policy:
    directory: db/migrations
    format: ordered reversible up/down pairs
    ledger: dialog_schema_migration via scripts/migrate.sh
    destructive_change_requires: .ai/workflows/change-contract.yaml
    lesson_context_rollback: migration 005 fails closed while anchored messages exist; migration 008 fails closed while v1 anchors exist
    message_channel_rollback: migration 006 fails closed while non-web messages exist
    assistant_ui_rollback: migration 007 fails closed while structured messages exist
    teacher_context_contracts_rollback: migration 009 fails closed while body-free mutation events exist
repository_ports: internal/domain/repository
