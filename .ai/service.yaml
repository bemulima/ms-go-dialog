schema_version: 1
name: ms-go-dialog
service_kind: backend_service
repository_role: service
repository:
    git_url: https://github.com/bemulima/ms-go-dialog.git
    default_branch: main
purpose: >-
    Independent authenticated personal, group, and contextual PersonalTeacher messaging
    service. It owns dialogs, membership, explicit message authorship, per-member read
    state, attachment authorization, moderation, realtime sequencing, WebSocket tickets,
    and outbox delivery. It does not own user profiles, authentication credentials,
    teacher pedagogy, student mastery, or attachment bytes.
release_contract_map: docs/agent-contract-map.md
stack:
    - name: language
      value: go
      source_path: go.mod
    - name: framework
      value: chi
      source_path: go.mod
    - name: persistence
      value: PostgreSQL with pgx
      source_path: go.mod
    - name: realtime
      value: NATS JetStream and Gorilla WebSocket
      source_path: go.mod
capabilities:
    - name: repository_bootstrap
      status: implemented
      source_path: AGENTS.md
    - name: personal_and_group_dialogs
      status: implemented
      source_path: docs/domain-map.md
    - name: per_member_read_state
      status: implemented
      source_path: docs/business-rules.md
    - name: files_and_images
      status: implemented
      source_path: docs/attachment-lifecycle.md
    - name: user_scoped_realtime
      status: implemented
      source_path: docs/websocket-contract.md
    - name: mode_aware_readiness_and_metrics
      status: implemented
      source_path: docs/operations.md
    - name: active_participant_batch_validation
      status: implemented
      source_path: docs/integration-contract.md
    - name: contextual_personal_teacher_dialogs
      status: implemented
      source_path: docs/business-rules.md
    - name: durable_teacher_request_delivery
      status: implemented
      source_path: docs/realtime-delivery.md
    - name: proactive_general_teacher_delivery
      status: implemented
      source_path: docs/integration-contract.md
relations:
    - name: depends_on
      value: postgres
    - name: depends_on
      value: nats
    - name: depends_on
      value: ms-go-filestorage
    - name: validates_participants_with
      value: ms-go-user
    - name: receives_identity_from
      value: ms-gateway
    - name: binds_logical_teacher_from
      value: ms-go-teacher-agent
    - name: emits_teacher_requests_to
      value: ms-go-teacher-agent
contracts:
    - .ai/contracts/database.yaml
    - .ai/contracts/http.yaml
    - .ai/contracts/websocket.yaml
    - .ai/contracts/events.yaml
    - .ai/contracts/frontend.yaml
instructions:
    - AGENTS.md
    - .ai/rules/common.md
    - docs/README.md
    - docs/domain-map.md
    - docs/agent-contract-map.md
    - docs/frontend-backend-contract-map.md
    - docs/integration-contract.md
    - docs/operations.md
commands:
    - format
    - dependencies
    - tidy
    - test
    - lint
    - validate_contracts
    - runtime_e2e
    - migrate_local
    - run_local
    - start_local_stack
    - stop_local_stack
workflows:
    - .ai/workflows/bugfix.yaml
    - .ai/workflows/implement-feature.yaml
    - .ai/workflows/refactor.yaml
    - .ai/workflows/review.yaml
    - .ai/workflows/issue-delivery.yaml
    - .ai/workflows/change-contract.yaml
    - .ai/workflows/test.yaml
