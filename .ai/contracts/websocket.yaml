schema_version: 1
status: implemented
source_of_truth: docs/websocket-contract.md
endpoint: GET /api/v1/ws
protocol: dialog.v1
authentication:
    mechanism: short-lived single-use opaque ticket
    transport: Sec-WebSocket-Protocol ticket.<opaque>
    maximum_ttl_seconds: 30
    query_credentials: forbidden
server_events:
    durable:
        - dialog.created
        - dialog.updated
        - dialog.closed
        - member.added
        - member.removed
        - member.role_updated
        - message.created
        - message.updated
        - message.deleted
        - message.hidden
        - message.restored
        - read.updated
        - attachment.ready
        - attachment.failed
    ephemeral:
        - connection.ready
        - typing.started
        - typing.stopped
        - error
        - ping
client_events:
    - typing.start
    - typing.stop
    - pong
limits:
    default_max_frame_bytes: 16384
    default_connections_per_user: 5
    default_outbound_queue_frames: 64
