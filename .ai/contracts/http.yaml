schema_version: 1
status: implemented
source_of_truth: docs/http-contract.md
route_groups:
    - prefix: /
      authentication: private operational network only; never public gateway routing
      routes:
        - GET /healthz
        - GET /readyz
        - GET /metrics
    - prefix: /api/v1
      authentication: required gateway identity and active membership where dialog-scoped
      routes:
        - PUT /dialog/personal/ensure
        - POST /dialog/group/create
        - GET /dialog/list
        - GET /dialog/get/{dialogID}
        - PUT /dialog/update/{dialogID}
        - PUT /dialog/read/{dialogID}
        - PUT /dialog/read-all/{dialogID}
        - POST /dialog/leave/{dialogID}
        - POST /dialog-member/add/{dialogID}
        - DELETE /dialog-member/remove/{dialogID}/{userID}
        - PUT /dialog-member/role/{dialogID}/{userID}
        - PUT /user-block/{userID}
        - DELETE /user-block/{userID}
        - GET /message/window
        - GET /message/list
        - GET /message/get/{messageID}
        - GET /message/changes
        - POST /message/create
        - PUT /message/update/{messageID}
        - DELETE /message/delete/{messageID}
        - POST /message-attachment/upload
        - GET /message-attachment/signed-url/{attachmentID}
        - DELETE /message-attachment/delete/{attachmentID}
        - POST /realtime/ticket
        - GET /ws
    - prefix: /admin/v1
      authentication: ADMIN configuration; ADMIN or MODERATOR explicit moderation
      routes:
        - POST /space/create
        - GET /space/list
        - PUT /space/update/{spaceID}
        - GET /dialog/list
        - PUT /dialog/close/{dialogID}
        - PUT /dialog/reopen/{dialogID}
        - PUT /message/hide/{messageID}
        - PUT /message/restore/{messageID}
    - prefix: /internal/v1
      authentication: exact X-Internal-Token; never gateway or browser routed
      routes:
        - PUT /teacher-dialog/ensure
        - GET /teacher-dialog/{dialogID}/request/{sourceMessageID}
        - POST /teacher-dialog/{dialogID}/message
pagination:
    message_order: message_sequence
    cursor: opaque and dialog scoped
error_contract: docs/error-contract.md
operations_contract: docs/operations.md
teacher_dialog:
    provisioning: internal command from ms-go-teacher-agent; browser cannot select personal_teacher_id
    request_context: exact source message plus at most 49 preceding messages; no unrestricted history
    response_append: idempotent per personal_teacher_id and key; source message is the reply target
