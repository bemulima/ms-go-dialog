schema_version: 1
status: implemented
source_of_truth: docs/http-contract.md
route_groups:
    - prefix: /
      authentication: private operational network only; never public gateway routing
      routes:
        - GET /healthz
        - GET /readyz
        - GET /metrics
    - prefix: /api/v1
      authentication: required gateway identity and active membership where dialog-scoped
      routes:
        - PUT /dialog/personal/ensure
        - POST /dialog/group/create
        - GET /dialog/list
        - GET /dialog/get/{dialogID}
        - PUT /dialog/update/{dialogID}
        - PUT /dialog/read/{dialogID}
        - PUT /dialog/read-all/{dialogID}
        - POST /dialog/leave/{dialogID}
        - POST /dialog-member/add/{dialogID}
        - DELETE /dialog-member/remove/{dialogID}/{userID}
        - PUT /dialog-member/role/{dialogID}/{userID}
        - PUT /user-block/{userID}
        - DELETE /user-block/{userID}
        - GET /message/window
        - GET /message/list
        - GET /message/get/{messageID}
        - GET /message/changes
        - POST /message/create
        - PUT /message/update/{messageID}
        - DELETE /message/delete/{messageID}
        - POST /message-attachment/upload
        - GET /message-attachment/signed-url/{attachmentID}
        - DELETE /message-attachment/delete/{attachmentID}
        - POST /realtime/ticket
        - GET /ws
    - prefix: /admin/v1
      authentication: ADMIN configuration; ADMIN or MODERATOR explicit moderation
      routes:
        - POST /space/create
        - GET /space/list
        - PUT /space/update/{spaceID}
        - GET /dialog/list
        - PUT /dialog/close/{dialogID}
        - PUT /dialog/reopen/{dialogID}
        - PUT /message/hide/{messageID}
        - PUT /message/restore/{messageID}
    - prefix: /internal/v1
      authentication: exact X-Internal-Token; never gateway or browser routed
      routes:
        - PUT /teacher-dialog/ensure
        - GET /teacher-dialog/{dialogID}/request/{sourceMessageID}
        - POST /teacher-dialog/{dialogID}/assistant-ui-source
        - POST /teacher-dialog/{dialogID}/message
        - POST /teacher-dialog/{dialogID}/proactive-message
        - POST /teacher-dialog/{dialogID}/student-channel-message
pagination:
    message_order: message_sequence
    cursor: opaque and dialog scoped
error_contract: docs/error-contract.md
operations_contract: docs/operations.md
teacher_dialog:
    provisioning: internal command from ms-go-teacher-agent; browser cannot select personal_teacher_id
    request_context: exact source message plus at most 49 preceding messages; no unrestricted history
    lesson_context:
        schema: lesson-message-context.v1
        accepted_by: authenticated user message create for an exact lesson teacher dialog only
        modes: lesson_overview forbids selected_text; selection requires exact non-blank selected_text
        fields: strict schema, mode, non-zero course_id and lesson_id UUIDs, RFC3339Nano content_revision, optional selected_text
        limits: selected_text at most 12000 Unicode code points
        binding: lesson_id must equal the dialog context_id
        immutability: create replay compares the complete anchor; update rejects the field; delete clears it
        compatibility: legacy content_revision plus selected_text remains readable, replayable, and temporarily create-compatible
    response_append: idempotent per personal_teacher_id and key; source message is the reply target
    channel_append: trusted Telegram adapter only; exact general binding and deterministic UUID idempotency key
    assistant_ui:
        accepted_by: internal response and proactive append only
        schema: assistant-ui.v1
        limits: 32 object blocks and 65536 encoded JSON bytes
        validation: envelope only; pedagogical block semantics remain opaque
        compatibility: optional in REST message responses; body remains required
        browser_create_update: rejected as unknown input
        stored_source_projection:
            route: POST /internal/v1/teacher-dialog/{dialogID}/assistant-ui-source
            request: exact student_id, personal_teacher_id, message_id; at most 4096 bytes
            response_schema: dialog-assistant-ui-source.v1
            response_allowlist: binding ids/context, message id/sequence/version, stored canonical assistant_ui
            absence_policy: wrong, missing, inactive, or cross-binding sources are indistinguishable 404
            exposure: internal exact-token only; no browser or admin route
