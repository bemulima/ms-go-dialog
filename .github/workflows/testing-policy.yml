name: Testing Policy Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: Testing Policy tier
        type: choice
        required: true
        default: verify:pr
        options:
          - verify:pr
          - verify:main
          - verify:nightly
          - verify:release

permissions:
  contents: read

jobs:
  testing-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"

      - name: Set up Go 1.24.4
        uses: actions/setup-go@v7
        with:
          go-version: "1.24.4"
          cache: true

      - name: Install pinned golangci-lint
        shell: bash
        run: |
          set -euo pipefail
          lint_bin="$GITHUB_WORKSPACE/.cache/bin"
          mkdir -p "$lint_bin"
          GOTOOLCHAIN=go1.24.4 GOBIN="$lint_bin" go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
          echo "$lint_bin" >> "$GITHUB_PATH"
          export PATH="$lint_bin:$PATH"
          resolved_linter="$(command -v golangci-lint)"
          if [[ "$resolved_linter" != "$lint_bin/golangci-lint" ]]; then
            echo "Unexpected golangci-lint executable: $resolved_linter" >&2
            exit 1
          fi
          linter_version="$("$resolved_linter" version)"
          printf '%s\n' "$linter_version"
          grep -Fq 'version v1.64.8' <<< "$linter_version"
          grep -Fq 'built with go1.24.4' <<< "$linter_version"

      - name: Check frozen policy bundle identity before execution
        run: |
          node --input-type=commonjs <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const expected = {
            lock_schema_version: 'testing-policy-bundle.v2',
            matrix_schema: 'required-test-matrix.v1',
            policy_source_commit: 'f8317b889892b35e9de6bd4e46bb1c20a15e6a88',
            policy_semantics_sha: '5a0422683ae97659d8f152df5a2b60d45d1893f9',
            bundle_sha256: 'b7a87cfbe229cee71379c9775bd36af0fb1f0a6da9c31b4d706a9fcdf3c5ea43',
            node_runtime_requirement: '>=20 <21',
          };
          if (Number(process.versions.node.split('.')[0]) !== 20) {
            throw new Error('Policy runner requires Node 20; got ' + process.versions.node);
          }
          const lock = JSON.parse(readFileSync('.ai/testing/policy/policy-lock.json', 'utf8'));
          for (const [key, value] of Object.entries(expected)) {
            if (lock[key] !== value) throw new Error('Policy lock identity mismatch: ' + key);
          }
          const actual = createHash('sha256')
            .update(readFileSync('.ai/testing/policy/policy-runner.cjs'))
            .digest('hex');
          if (actual !== expected.bundle_sha256) throw new Error('Policy bundle checksum mismatch');
          console.log('Policy bundle checksum PASS sha256=' + actual);
          NODE
          node .ai/testing/policy/policy-runner.cjs --version
          node .ai/testing/policy/policy-runner.cjs verify-lock --lock .ai/testing/policy/policy-lock.json

      - name: Validate testing manifest
        run: node .ai/testing/policy/policy-runner.cjs validate --repo .

      - name: Run selected Testing Policy tier
        id: policy_run
        continue-on-error: true
        env:
          POLICY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          POLICY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_HEAD_SHA: ${{ github.sha }}
          POLICY_TIER_COMMAND: ${{ github.event_name == 'schedule' && 'verify:nightly' || github.event_name == 'pull_request' && 'verify:pr' || github.event_name == 'push' && 'verify:main' || inputs.command || 'verify:pr' }}
        shell: bash
        run: |
          args=(node .ai/testing/policy/policy-runner.cjs verify --repo . --command "$POLICY_TIER_COMMAND" --output-dir . --run-id "$POLICY_RUN_ID" --head "$POLICY_HEAD_SHA")
          if [[ -n "$POLICY_BASE_SHA" ]]; then
            args+=(--base "$POLICY_BASE_SHA")
          fi
          "${args[@]}"

      - name: Validate policy result artifacts
        id: result_validation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d test-results ]]; then
            echo 'No test-results directory was produced.' >&2
            exit 1
          fi
          mapfile -d '' result_files < <(find test-results -type f -name test-result.v1.json -print0)
          if ((${#result_files[@]} == 0)); then
            echo 'No test-result.v1.json files were produced.' >&2
            exit 1
          fi
          for result in "${result_files[@]}"; do
            node .ai/testing/policy/policy-runner.cjs validate-result --repo . --result "$result"
          done

      - name: Resolve result and declared artifact paths
        id: upload_manifest
        if: always()
        env:
          POLICY_TIER_COMMAND: ${{ github.event_name == 'schedule' && 'verify:nightly' || github.event_name == 'pull_request' && 'verify:pr' || github.event_name == 'push' && 'verify:main' || inputs.command || 'verify:pr' }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { appendFileSync, readdirSync, lstatSync, readFileSync } = require('node:fs');
          const { relative, resolve, sep } = require('node:path');
          const root = resolve('.');
          const files = [];
          function walk(directory) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = resolve(directory, entry.name);
              const info = lstatSync(path);
              if (info.isSymbolicLink()) throw new Error('Result tree contains a symbolic link.');
              if (info.isDirectory()) walk(path);
              else if (info.isFile() && entry.name === 'test-result.v1.json') files.push(path);
            }
          }
          if (lstatSync('test-results', { throwIfNoEntry: false })?.isDirectory()) walk('test-results');
          const paths = new Set();
          const tiers = new Set();
          for (const file of files) {
            paths.add(relative(root, file).split(sep).join('/'));
            const result = JSON.parse(readFileSync(file, 'utf8'));
            if (['verify:pr', 'verify:main', 'verify:nightly', 'verify:release'].includes(result.command)) tiers.add(result.tier);
            for (const artifact of result.artifacts || []) {
              if (artifact.uri.includes('://') || artifact.uri.includes('\n') || artifact.uri.includes('\r')) {
                throw new Error('Required artifact URI cannot be uploaded as a repository file.');
              }
              paths.add(artifact.uri);
            }
          }
          if (paths.size === 0) throw new Error('No test results or declared artifacts are available for upload.');
          if (tiers.size !== 1) throw new Error('Aggregate results do not agree on one CI tier.');
          const tier = [...tiers][0];
          const retentionDays = { PR: 30, MAIN: 90, NIGHTLY: 90, RELEASE: 365 }[tier];
          if (!retentionDays) throw new Error('Unsupported artifact retention tier: ' + tier);
          if (process.env.POLICY_TIER_COMMAND !== 'verify:' + tier.toLowerCase()) {
            throw new Error('Resolved tier does not match the selected workflow tier.');
          }
          const lines = [...paths].sort();
          if (lines.some((path) => path.startsWith('/') || path.split('/').includes('..'))) {
            throw new Error('Artifact path escapes the repository.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'paths<<POLICY_PATHS\n' + lines.join('\n') + '\nPOLICY_PATHS\n');
          appendFileSync(process.env.GITHUB_OUTPUT, 'retention_days=' + retentionDays + '\n');
          NODE

      - name: Upload policy result artifacts
        id: result_upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testing-policy-results
          path: ${{ steps.upload_manifest.outputs.paths }}
          if-no-files-found: error
          retention-days: ${{ steps.upload_manifest.outputs.retention_days }}

      - name: Enforce policy result after artifact upload
        if: always()
        env:
          POLICY_RUN_OUTCOME: ${{ steps.policy_run.outcome }}
          POLICY_TIER_COMMAND: ${{ github.event_name == 'schedule' && 'verify:nightly' || github.event_name == 'pull_request' && 'verify:pr' || github.event_name == 'push' && 'verify:main' || inputs.command || 'verify:pr' }}
          RESULT_VALIDATION_OUTCOME: ${{ steps.result_validation.outcome }}
          RESULT_UPLOAD_OUTCOME: ${{ steps.result_upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RESULT_VALIDATION_OUTCOME" != success ]]; then
            echo "Policy result validation failed (outcome: $RESULT_VALIDATION_OUTCOME)" >&2
            exit 1
          fi
          if [[ "$RESULT_UPLOAD_OUTCOME" != success ]]; then
            echo "Policy result upload failed (outcome: $RESULT_UPLOAD_OUTCOME)" >&2
            exit 1
          fi
          if [[ ! -d test-results ]]; then
            echo 'No test-results directory is available for final enforcement.' >&2
            exit 1
          fi
          mapfile -d '' result_files < <(find test-results -type f -name test-result.v1.json -print0)
          if ((${#result_files[@]} == 0)); then
            echo 'No test-result.v1.json files are available for final enforcement.' >&2
            exit 1
          fi
          for result in "${result_files[@]}"; do
            node .ai/testing/policy/policy-runner.cjs enforce-result --repo . --result "$result"
          done
          if [[ "$POLICY_RUN_OUTCOME" != success ]]; then
            echo "Policy tier $POLICY_TIER_COMMAND did not pass (outcome: $POLICY_RUN_OUTCOME)" >&2
            exit 1
          fi
