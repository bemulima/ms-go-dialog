schema_version: 1
style: clean_architecture
entrypoints:
    - name: ms-dialog-service
      source_path: cmd/ms-dialog-service/main.go
      responsibilities:
        - process lifecycle
        - dependency composition
        - graceful shutdown
layers:
    - name: domain
      source_path: internal/domain
      responsibilities:
        - entities and value objects
        - invariants and stable errors
        - repository and event ports
      dependency_rule: imports no transport or infrastructure
    - name: usecase
      source_path: internal/usecase
      responsibilities:
        - membership authorization
        - transaction-scoped business processes
        - message/event sequence and outbox orchestration
      dependency_rule: depends on domain ports, not concrete transport or infrastructure
    - name: http_transport
      source_path: internal/transport/http
      responsibilities:
        - API, admin, and private route contours
        - route groups and middleware
        - strict request/response mapping
        - trusted gateway actor extraction
      dependency_rule: handlers remain thin and call use cases
    - name: websocket_transport
      source_path: internal/transport/websocket
      responsibilities:
        - ticket consumption
        - connection and subscription lifecycle
        - event and typing projection
      dependency_rule: does not duplicate durable message business rules
    - name: message_transport
      source_path: internal/transport/message
      responsibilities:
        - inbound lifecycle and typing fan-out subscription
      dependency_rule: projects committed messages only
    - name: postgres_infrastructure
      source_path: internal/infrastructure/persistence/postgres
      responsibilities:
        - pgx repositories
        - transaction manager
        - outbox claiming
    - name: nats_infrastructure
      source_path: internal/infrastructure/messaging/nats
      responsibilities:
        - JetStream publication
        - Core NATS typing fan-out
    - name: filestorage_infrastructure
      source_path: internal/infrastructure/filestorage
      responsibilities:
        - temporary upload
        - idempotent activation/deletion
        - signed URL requests
    - name: filescan_infrastructure
      source_path: internal/infrastructure/filescan
      responsibilities:
        - ClamAV INSTREAM protocol
        - fail-closed generic file scanning
    - name: user_http_infrastructure
      source_path: internal/infrastructure/http/user
      responsibilities:
        - bounded active-participant batch resolution
        - strict response partition validation
        - fail-closed dependency error mapping
    - name: health_and_observability_infrastructure
      source_path: internal/infrastructure
      responsibilities:
        - mode-aware dependency readiness
        - bounded-cardinality Prometheus exposition
        - WebSocket and worker lifecycle metrics
domain_ownership:
    - DialogSpace
    - Dialog
    - DialogMember
    - DialogMessage
    - DialogAttachment
    - OutboxEvent
    - RealtimeTicket
    - UserBlock
    - TeacherDialogBinding
    - MessageAuthor
external_ownership:
    - name: user_identity_and_profile
      owner: ms-go-auth/ms-go-user
      local_reference: UUID without cross-database FK; activity resolved through private batch API
    - name: attachment_bytes
      owner: ms-go-filestorage
      local_reference: filestorage_id
    - name: personal_teacher_identity_and_pedagogy
      owner: ms-go-teacher-agent
      local_reference: personal_teacher_id on teacher dialogs and teacher-authored messages
    - name: learning_action
      owner: ms-go-student
      local_reference: opaque learning_action_id on task/project teacher-dialog messages
runtime_modes:
    - all
    - api
    - realtime
    - worker
